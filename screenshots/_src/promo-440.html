<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=440">
<title>VKT SnapOCR — 440×280 promo tile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:440px;height:280px;overflow:hidden}
body{
  font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",Arial,sans-serif;
  background:radial-gradient(320px 200px at 100% 0%, #e6ecff, rgba(255,255,255,0) 70%), linear-gradient(135deg,#ffffff,#f2f5ff);
  color:#4b5568;-webkit-font-smoothing:antialiased;
}
.tile{position:relative;width:440px;height:280px;padding:26px 24px;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:4px;background:linear-gradient(90deg,#4f6ef7,#93a6ff)}
.ring{position:absolute;right:-70px;top:-80px;width:250px;height:250px;border-radius:50%;border:1px solid rgba(79,110,247,.18);box-shadow:0 0 0 34px rgba(79,110,247,.05)}
.brand{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand img{width:28px;height:28px;border-radius:8px;border:1px solid #e6e8ee;background:#fff}
.brand b{font-size:15px;color:#1f2430;font-weight:800}
h1{position:relative;z-index:2;font-size:27px;line-height:1.1;letter-spacing:-.035em;color:#1f2430;font-weight:800;margin-bottom:9px}
h1 em{font-style:normal;color:#4f6ef7}
p{position:relative;z-index:2;font-size:11.5px;line-height:1.45;max-width:330px;margin-bottom:12px}
.chips{position:relative;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid #e6e8ee;color:#4b5568}
.chip.on{background:#eef1fe;border-color:#cdd7fe;color:#4f6ef7}
</style>
</head>
<body>
  <div class="tile">
    <div class="ring"></div>
    <div class="brand"><img src="../../icons/icon128.png" alt=""><b>VKT SnapOCR</b></div>
    <h1>Text in a screenshot,<br><em>now selectable</em></h1>
    <p>Drag a box over any part of a page and copy the words. OCR runs locally — screenshots are never uploaded.</p>
    <div class="chips">
      <span class="chip on">100% local</span>
      <span class="chip">Works offline</span>
      <span class="chip">No account</span>
    </div>
  </div>
</body>
</html>
